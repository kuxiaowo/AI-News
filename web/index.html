<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 今日新闻</title>
    <style>
      :root { --fg:#111; --muted:#666; --bg:#fafafa; --card:#fff; --brand:#2f6feb; --header-bg:#1a73e8; --highlight-bg:#eef2f9; }
      *{ box-sizing:border-box }
      body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; color:var(--fg); background:var(--bg) }
      header{ padding:20px 30px; background:var(--header-bg); color:#fff; position:sticky; top:0 }
      header h1{ margin:0; font-size:24px; font-weight:600 }
      main{ max-width:960px; margin:20px auto; padding:0 16px 40px }
      .section{ background:var(--card); border:1px solid #eee; border-radius:8px; padding:16px; margin-bottom:20px; box-shadow:0 2px 10px rgba(0,0,0,.05) }
      .section h2{ font-size:18px; font-weight:600; margin:0 0 10px }
      .summary{ white-space:pre-wrap; line-height:1.6 }
      .news-container{ display:grid; grid-template-columns:1fr 1fr; gap:16px }
      .item{ padding:10px; border:1px solid #eee; border-radius:8px; background:var(--highlight-bg) }
      .item .title{ font-weight:600; font-size:16px }
      .meta{ color:var(--muted); font-size:13px }
      a{ color:var(--brand); text-decoration:none }
      a:hover{ text-decoration:underline }
      .loading{ color:var(--muted) }
      @media (max-width:760px){ .news-container{ grid-template-columns:1fr } }
    </style>
  </head>
  <body>
    <header>
      <h1>AI 今日新闻</h1>
    </header>
    <main>
      <section class="section">
        <h2>今日新闻摘要</h2>
        <div id="summary" class="summary loading">加载摘要中…</div>
      </section>
      <section class="section">
        <h2 style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span>精选新闻</span>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center;">
            <input id="kw" type="search" placeholder="输入关键词筛选" style="padding:6px 8px;border:1px solid #ddd;border-radius:6px;min-width:220px;">
            <button id="filterBtn" style="padding:6px 12px;border:1px solid #2f6feb;background:#2f6feb;color:#fff;border-radius:6px;cursor:pointer;">筛选</button>
          </span>
        </h2>
        <div id="news" class="news-container"></div>
      </section>
    </main>

    <script>
      async function fetchJSON(url){
        const res = await fetch(url);
        if(!res.ok) throw new Error('HTTP '+res.status);
        return res.json();
      }
      function renderNews(items){
        const box = document.getElementById('news');
        box.innerHTML = '';
        items.forEach(it => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <div class="title"><a href="${it.url}" target="_blank" rel="noreferrer">${it.title}</a></div>
            <div class="meta">来源：${it.source || ''}</div>
            <div class="meta">${it.brief || ''}</div>
          `;
          box.appendChild(div);
        });
      }
      function qs(params){
        const usp = new URLSearchParams();
        Object.entries(params).forEach(([k,v])=>{ if(v!==undefined && v!==null && String(v).trim()!==''){ usp.set(k,v); } });
        return usp.toString();
      }
      async function load(keyword){
        try{
          const q = qs({ count: 30, word: keyword });
          const news = await fetchJSON('/api/news' + (q?('?'+q):''));
          renderNews(news.items||[]);
        }catch(e){ console.error(e); }
        try{
          const q = qs({ count: 30, word: keyword });
          const s = await fetchJSON('/api/summary' + (q?('?'+q):''));
          document.getElementById('summary').classList.remove('loading');
          document.getElementById('summary').textContent = s.summary || '暂无摘要';
        }catch(e){
          document.getElementById('summary').textContent = '摘要加载失败';
          console.error(e);
        }
      }
      document.getElementById('filterBtn').addEventListener('click', ()=>{
        const kw = document.getElementById('kw').value.trim();
        document.getElementById('summary').textContent = '加载摘要中…';
        document.getElementById('summary').classList.add('loading');
        load(kw);
      });
      document.getElementById('kw').addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          document.getElementById('filterBtn').click();
        }
      });
      load();
    </script>
  </body>
  </html>
